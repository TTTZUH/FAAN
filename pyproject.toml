[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faan-bda"
version = "0.1.0"
description = "FAAN training and evaluation pipeline for xBD building damage assessment"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "torch>=2.0.1",
  "torchvision>=0.15.2",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
faan = "faan.cli:main"

[tool.setuptools.packages.find]
include = ["faan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
